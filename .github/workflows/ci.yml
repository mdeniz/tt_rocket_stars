name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # GitHub-hosted Ubuntu provides the browser system libraries. Installing
      # OS packages here can hang during runner image or mirror migrations.
      # Keep browser binaries cached and install them only when the cache is cold.
      - name: Install WebKit runtime dependency
        run: sudo apt-get install -y --no-install-recommends libevent-2.1-7t64
      - run: npx playwright install chromium firefox webkit
      - run: npm run check
      - name: Run the full desktop browser matrix
        env:
          PLAYWRIGHT_FULL: '1'
        run: npm run test:e2e
      - name: Run mobile WebKit checks
        env:
          PLAYWRIGHT_MOBILE: '1'
          PLAYWRIGHT_WORKERS: '1'
        run: npx playwright test --project=webkit-mobile
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
