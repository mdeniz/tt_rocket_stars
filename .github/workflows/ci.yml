name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # GitHub-hosted Ubuntu already provides the browser system libraries.
      # Installing OS packages here can hang during runner image migrations;
      # browser binaries are restored by the cache above and installed only
      # when the cache is cold.
      - run: npx playwright install chromium firefox webkit
      - name: Install WebKit runtime dependency
        run: >-
          sudo apt-get update -qq &&
          (sudo apt-get install -y -qq libevent-2.1-7t64 libopus0 libflite1
          libavif16 libharfbuzz-icu0
          libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0
          libgstreamer-plugins-bad1.0-0 ||
          sudo apt-get install -y -qq libevent-2.1-7 libopus0 libflite1
          libavif16 libharfbuzz-icu0
          libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0
          libgstreamer-plugins-bad1.0-0)
      - run: npm run check
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
