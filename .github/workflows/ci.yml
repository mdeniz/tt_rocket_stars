name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Determine check scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_suite: ${{ steps.classify.outputs.full_suite }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" ]]; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            diff_range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            echo "Unknown or manual event range; running the full suite."
            exit 0
          fi

          changed_files="$(git diff --name-only "$diff_range")"
          if [[ -z "$changed_files" ]]; then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running the full suite conservatively."
            exit 0
          fi

          full_suite=false
          while IFS= read -r file; do
            case "$file" in
              openspec/*|docs/*|*.md)
                ;;
              *)
                full_suite=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "full_suite=$full_suite" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n%s\n' "$changed_files"
          echo "Full suite: $full_suite"

  repository-checks:
    name: Repository checks
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Run lightweight documentation checks
        if: needs.changes.outputs.full_suite != 'true'
        run: |
          git diff --check
          node scripts/check-docs.cjs
      - name: Install dependencies
        if: needs.changes.outputs.full_suite == 'true'
        run: npm ci --no-audit --no-fund
      - name: Run repository checks
        if: needs.changes.outputs.full_suite == 'true'
        run: npm run check

  browser-tests:
    name: Browser tests (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            mobile: '0'
            workers: '2'
          - project: firefox
            browser: firefox
            mobile: '0'
            workers: '2'
          - project: webkit
            browser: webkit
            mobile: '0'
            workers: '2'
          - project: webkit-mobile
            browser: webkit
            mobile: '1'
            workers: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Restore Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install WebKit runtime dependencies
        if: matrix.browser == 'webkit'
        run: |
          sudo apt-get install -y --no-install-recommends \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libatomic1 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcairo-gobject2 \
            libcairo2 \
            libdbus-1-3 \
            libdrm2 \
            libenchant-2-2 \
            libepoxy0 \
            libevent-2.1-7t64 \
            libflite1 \
            libfontconfig1 \
            libfreetype6 \
            libgbm1 \
            libgdk-pixbuf-2.0-0 \
            libgles2 \
            libglib2.0-0t64 \
            libgstreamer-gl1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer1.0-0 \
            libgtk-4-1 \
            libharfbuzz-icu0 \
            libharfbuzz0b \
            libhyphen0 \
            libicu74 \
            libjpeg-turbo8 \
            liblcms2-2 \
            libmanette-0.2-0 \
            libopus0 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libpng16-16t64 \
            libsecret-1-0 \
            libvpx9 \
            libwayland-client0 \
            libwayland-egl1 \
            libwayland-server0 \
            libwebp7 \
            libwebpdemux2 \
            libwoff1 \
            libx11-6 \
            libxkbcommon0 \
            libxml2 \
            libxslt1.1 \
            libx264-164 \
            libavif16
      - name: Install selected Playwright browser
        run: npx playwright install ${{ matrix.browser }}
      - name: Run selected Playwright project
        env:
          PLAYWRIGHT_MOBILE: ${{ matrix.mobile }}
          PLAYWRIGHT_WORKERS: ${{ matrix.workers }}
        run: npx playwright test --project=${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
