name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # GitHub-hosted Ubuntu provides nearly all browser system libraries.
      # Install only the WebKit runtime libraries missing from the current
      # image; avoid the full Playwright OS dependency installer, which can stall.
      - name: Install WebKit runtime library
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
          libevent-2.1-7t64 libopus0 libgstreamer-plugins-base1.0-0
      - run: npx playwright install chromium firefox webkit
      - run: npm run check
      - run: npm run test:e2e
      - name: Run mobile WebKit checks
        env:
          PLAYWRIGHT_MOBILE: '1'
          PLAYWRIGHT_WORKERS: '1'
        run: npx playwright test --project=webkit-mobile
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
