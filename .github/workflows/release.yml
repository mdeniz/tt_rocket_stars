name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_SITE_URL: ${{ vars.VITE_APP_SITE_URL }}
      VITE_TRUSTED_CLOUD_FUNCTION_URL: ${{ vars.VITE_TRUSTED_CLOUD_FUNCTION_URL }}
      VITE_ENABLE_TRUSTED_CLOUD_TRANSPORT: ${{ vars.VITE_ENABLE_TRUSTED_CLOUD_TRANSPORT }}
      VITE_ENABLE_LEGACY_CLOUD_DIRECT_FALLBACK: ${{ vars.VITE_ENABLE_LEGACY_CLOUD_DIRECT_FALLBACK }}
      VITE_REACT_CORE_SCREENS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate release tag and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs=require("node:fs");const tag=process.env.TAG;const version=require("./package.json").version;if(tag!==`v${version}`)throw Error(`Tag ${tag} must match package version v${version}`);if(!fs.readFileSync("CHANGELOG.md","utf8").includes(`## [${version}] -`))throw Error(`CHANGELOG.md has no entry for ${version}`)'
      - run: npm run check
      - name: Prepare release asset
        env:
          TAG: ${{ github.ref_name }}
        run: cp dist/index_next.html "tt-rocket-stars-$TAG.html"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "tt-rocket-stars-$TAG.html" --verify-tag --title "TT Rocket Stars $TAG" --generate-notes
      - name: Refresh stable Pages entrypoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
