name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate release tag and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs=require("node:fs");const tag=process.env.TAG;const version=require("./package.json").version;if(tag!==`v${version}`)throw Error(`Tag ${tag} must match package version v${version}`);if(!fs.readFileSync("CHANGELOG.md","utf8").includes(`## [${version}] -`))throw Error(`CHANGELOG.md has no entry for ${version}`)'
      - run: npm run check
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "dist/index.html#tt-rocket-stars-$TAG.html" --verify-tag --title "TT Rocket Stars $TAG" --generate-notes
