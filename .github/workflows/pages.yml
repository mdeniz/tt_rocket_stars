name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_SITE_URL: ${{ vars.VITE_APP_SITE_URL }}
      VITE_ENABLE_CLOUD_ACCESS: ${{ vars.VITE_ENABLE_CLOUD_ACCESS }}
      VITE_TRUSTED_CLOUD_FUNCTION_URL: ${{ vars.VITE_TRUSTED_CLOUD_FUNCTION_URL }}
      VITE_ENABLE_TRUSTED_CLOUD_TRANSPORT: ${{ vars.VITE_ENABLE_TRUSTED_CLOUD_TRANSPORT }}
      VITE_ENABLE_LEGACY_CLOUD_DIRECT_FALLBACK: ${{ vars.VITE_ENABLE_LEGACY_CLOUD_DIRECT_FALLBACK }}
      VITE_REACT_CORE_SCREENS: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Restore stable release entrypoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if stable_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null); then
            stable_asset=$(gh release view "$stable_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | endswith(".html")) | .name' | head -n 1)
            if [ -z "$stable_asset" ]; then
              echo "Release $stable_tag has no HTML asset; keeping the current build as the stable fallback"
              exit 0
            fi
            gh release download "$stable_tag" --repo "$GITHUB_REPOSITORY" --pattern "$stable_asset" --dir dist --clobber
            if [ "$stable_asset" != "index.html" ]; then
              mv "dist/$stable_asset" dist/index.html
            fi
            echo "Restored stable release $stable_tag as dist/index.html"
          else
            echo "No published release found; keeping the current build as the stable fallback"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
